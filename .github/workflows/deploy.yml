# Publishes the site after CI passes on main. It waits on the CI run rather than repeating the
# tests. The token lives in the CLOUDFLARE_API_TOKEN secret and only needs to edit Workers.
name: Deploy site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-site

jobs:
  site:
    # A fork's own main branch also matches the filter above, so only a push here counts.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm run site:build
      - run: npx --yes wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
