[package]
name = "fluidither"
version = "0.3.0"
edition = "2021"
authors = ["vrnrn"]
license = "MIT"
description = "Dithered, spring-driven UI components for GPUI"
repository = "https://github.com/vrnrn/fluidither"
homepage = "https://fluidither.vrnrn.com"
readme = "README.md"
keywords = ["gpui", "ui", "components", "dither", "spring"]
categories = ["gui"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = ["zed"]
# Builds against crates.io gpui. Shaders compile at app start, so building
# needs no Metal toolchain.
zed = ["dep:gpui"]
# Builds against the gpui-pre API instead, for apps that carry their own GPUI
# (such as a patched fork). Turn off default features when choosing it.
pre = ["dep:gpui_pre"]

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"], optional = true }
gpui_pre = { package = "gpui-pre", version = "=0.3.9", default-features = false, optional = true }
image = "0.25"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders", "test-support"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
